# Rotazione dei log della pipeline: sul server va in /etc/logrotate.d/pipeline
# (lo copia deploy.sh). I log si conservano 30 giorni.
#
# - Ogni giorno il log non vuoto viene rinominato con la data (pipeline-rm.log
#   -> pipeline-rm.log-20270102) e dal giorno dopo compresso. Si rinomina, non
#   si copia: la data di ultima scrittura resta quella vera.
# - Le copie ferme da piu' di 30 giorni le toglie la riga `find` del crontab
#   (cron.example): `maxage` qui non basta, perche' logrotate lo guarda solo
#   quando gira di nuovo QUEL log, e quello di una provincia si riscrive ogni
#   tre mesi.
# - Mai mentre un lavoro tiene il lucchetto dell'archivio (cicli, giri a mano):
#   sta scrivendo il suo log e giro_regione.py lo rilegge. Si riprova domani.
/var/log/pipeline*.log /var/log/candidati*.log {
    daily
    rotate 30
    maxage 30
    dateext
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    prerotate
        L=/opt/agente-commerciale-pipeline/cache/.lucchetto_giro_regione
        test ! -e "$L" || flock -n "$L" true
    endscript
}
